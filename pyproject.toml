[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verreport"
version = "0.1.0"
description = "Verification report dashboard generator (GTest, LLVM coverage, CPPCheck, Lizard)"
requires-python = ">=3.11"
dependencies = ["Jinja2>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
verreport = "verreport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
verreport = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
